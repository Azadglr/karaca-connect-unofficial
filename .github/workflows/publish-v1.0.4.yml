name: Publish Karaca v1.0.4

on:
  push:
    branches:
      - main
    paths:
      - "custom_components/karaca_connect/manifest.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'Azadglr/karaca-connect-unofficial'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
      - name: Validate both version fields
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import re
          manifest = json.loads(Path("custom_components/karaca_connect/manifest.json").read_text())
          const = Path("custom_components/karaca_connect/const.py").read_text()
          assert manifest["version"] == "1.0.4", manifest["version"]
          assert re.search(r'^VERSION = "1\.0\.4"$', const, re.M), "const.py mismatch"
          print("Version fields verified: 1.0.4")
          PY
      - name: Publish v1.0.4 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v1.0.4" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v1.0.4 already published"
            exit 0
          fi
          gh release create "v1.0.4" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Karaca Connect Unofficial v1.0.4" \
            --notes-file ".github/releases/v1.0.4.md" \
            --latest

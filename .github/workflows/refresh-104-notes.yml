name: Refresh v1.0.4 release notes

on:
  push:
    branches:
      - main
    paths:
      - ".github/releases/v1.0.4.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-release:
    if: github.repository == 'Azadglr/karaca-connect-unofficial'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update public release description
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v1.0.4 \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file ".github/releases/v1.0.4.md"
